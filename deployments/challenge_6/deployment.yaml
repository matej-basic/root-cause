---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctf-6
  namespace: ctf
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: ctf-6
  template:
    metadata:
      labels:
        app: ctf-6
    spec: 
      containers: 
        - name: ctf-6
          image: "docker.io/matejbasic/cve-2022-42889:1.0"
      nodeName: worker-03
---
apiVersion: v1
kind: Service
metadata:
  name: ctf-6-svc
  namespace: ctf
spec: 
  selector:
    app: ctf-6
  type: NodePort
  ports: 
    - port: 8080
      nodePort: 30105
      targetPort: 8080