apiVersion: v1
kind: Pod
metadata:
  name: erms
  labels:
    name: erms
spec:
  containers:
    - name: erms-web
      image: docker.io/jura43/erms
      resources:
        limits:
          memory: "128Mi"
          cpu: "500m"
      ports:
        - containerPort: 80
          hostPort: 10000
      extraHosts:
        - host-db:10.1.0.4
