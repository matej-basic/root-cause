apiVersion: v1
kind: Pod
metadata:
  name: froxlor
  labels:
    name: froxlor
spec:
  containers:
    - name: froxlor-web
      image: docker.io/jura43/froxlor
      resources:
        limits:
          memory: "128Mi"
          cpu: "500m"
      ports:
        - containerPort: 80
          hostPort: 10006
      extraHosts:
        - host-db:10.1.0.4
