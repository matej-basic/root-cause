---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctf-5
  namespace: ctf
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: ctf-5
  template:
    metadata:
      labels:
        app: ctf-5
    spec: 
      containers: 
        - name: ctf-5
          image: "docker.io/matejbasic/cve-2022-37454:1.0"
      nodeName: worker-03
---
apiVersion: v1
kind: Service
metadata:
  name: ctf-5-svc
  namespace: ctf
spec: 
  selector:
    app: ctf-5
  type: NodePort
  ports: 
    - port: 8080
      nodePort: 30104
      targetPort: 8080