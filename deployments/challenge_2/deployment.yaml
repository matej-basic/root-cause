---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctf-2
  namespace: ctf
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: ctf-2
  template:
    metadata:
      labels:
        app: ctf-2
    spec: 
      containers: 
        - name: ctf-2
          image: "docker.io/matejbasic/cve-2022-0847"
      nodeName: worker-03
---
apiVersion: v1
kind: Service
metadata:
  name: ctf-2-svc
  namespace: ctf
spec: 
  selector:
    app: ctf-2
  type: NodePort
  ports: 
    - port: 22
      nodePort: 10001
      targetPort: 22