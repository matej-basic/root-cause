---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctf-4
  namespace: ctf
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: ctf-4
  template:
    metadata:
      labels:
        app: ctf-4
    spec: 
      containers: 
        - name: ctf-4
          image: "docker.io/matejbasic/cve-2022-22965"
      nodeName: worker-03
---
apiVersion: v1
kind: Service
metadata:
  name: ctf-4-svc
  namespace: ctf
spec: 
  selector:
    app: ctf-4
  type: NodePort
  ports: 
    - port: 8080
      nodePort: 30103
      targetPort: 8080