---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctf-3
  namespace: ctf
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: ctf-3
  template:
    metadata:
      labels:
        app: ctf-3
    spec: 
      containers: 
        - name: ctf-3
          image: "docker.io/matejbasic/cve-2022-1271:1.0"
      nodeName: worker-03
---
apiVersion: v1
kind: Service
metadata:
  name: ctf-3-svc
  namespace: ctf
spec: 
  selector:
    app: ctf-3
  type: NodePort
  ports: 
    - port: 8080
      nodePort: 30102
      targetPort: 8080