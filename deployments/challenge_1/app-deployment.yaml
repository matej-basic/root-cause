apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctf-1
  namespace: ctf
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: ctf-1
  template:
    metadata:
      labels:
        app: ctf-1
    spec: 
      containers:
        - name: ctf-1
          image: "docker.io/jura43/erms:latest"
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ctf-1-svc
  namespace: ctf
spec: 
  selector: 
    app: ctf-1
  type: ClusterIP
  port: 
    - name: ctf-1
      protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: ctf
  name: ctf-1-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - host: ctf-1.apps.oberin.cloud
      http:
        paths:
          - path: /?(.*)
            pathType: Prefix
            backend:
              service:
                name: ctf-1-svc
                port:
                  number: 80